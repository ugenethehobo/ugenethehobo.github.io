# XcodeGen project: `brew install xcodegen && xcodegen` creates HomeLights.xcodeproj.
# Set BUNDLE_PREFIX in Config.xcconfig first (it must be unique to you).
name: HomeLights
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HomeLights:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).homelights
        PRODUCT_NAME: HomeLights
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lights
        AppGroupID: group.$(BUNDLE_PREFIX).homelights
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Used once, so schedules can follow sunrise and sunset where you live.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/HomeLights.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).homelights
    dependencies:
      - target: HomeLightsWidgets
  HomeLightsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).homelights.widgets
        PRODUCT_NAME: HomeLightsWidgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Lights
        AppGroupID: group.$(BUNDLE_PREFIX).homelights
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HomeLightsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).homelights
# One scheme for the app (which embeds the widgets), so Run always launches
# the app rather than trying to launch the widget extension by itself.
schemes:
  HomeLights:
    build:
      targets:
        HomeLights: all
        HomeLightsWidgets: all
    run:
      config: Debug
      executable: HomeLights
    archive:
      config: Release
