name: ESPN probe (temporary)
on:
  push:
    paths: ['.github/probe/**', '.github/workflows/espn-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/probe/espn.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lights/test/fixtures
          git commit -m "Add a recorded Chiefs game as a test fixture"
          git push
