# XcodeGen project: `brew install xcodegen && xcodegen` creates HomeClimate.xcodeproj.
# Set BUNDLE_PREFIX in Config.xcconfig first (it must be unique to you).
name: HomeClimate
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  HomeClimate:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).homeclimate
        PRODUCT_NAME: HomeClimate
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Climate
        AppGroupID: group.$(BUNDLE_PREFIX).homeclimate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/HomeClimate.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).homeclimate
    dependencies:
      - target: HomeClimateWidgets
  HomeClimateWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).homeclimate.widgets
        PRODUCT_NAME: HomeClimateWidgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Climate
        AppGroupID: group.$(BUNDLE_PREFIX).homeclimate
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/HomeClimateWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).homeclimate
